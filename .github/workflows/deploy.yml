# Test every push/PR. Pushes to `main` also publish the built site to the
# `gh-pages` branch — a branch that only ever holds generated output, so
# source code and build files never mix.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Deploy from a
# branch -> `gh-pages` / (root).
name: Build, test & publish to gh-pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to push the gh-pages branch

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (served from /<repo>/, noindex preview)
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
          PREVIEW: '1'

      - name: Publish dist/ to the gh-pages branch
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Commit on top of the existing gh-pages history (no force push).
          if git fetch -q --depth=1 origin gh-pages; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          git commit -q -m "deploy: ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q origin gh-pages
          echo "Published ${GITHUB_SHA::7} to gh-pages."
